  <circle cx="60" cy="62" r="18" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="60" cy="62" r="8" fill="#0f172a"/>
  <!-- Status Light -->
  <circle cx="60" cy="62" r="3" fill="#34d399"/>
  <text x="60" y="90" fill="#64748b" font-size="6" font-weight="bold" font-family="sans-serif" text-anchor="middle">HYBRID · 48V</text>
  <rect x="36" y="96" width="48" height="8" rx="2" fill="#e2e8f0"/>
