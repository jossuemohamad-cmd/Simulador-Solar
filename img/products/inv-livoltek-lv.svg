      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="livoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect x="24" y="10" width="72" height="100" rx="10" fill="url(#livoBody)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Top Curve Accent -->
  <path d="M26 22 Q60 14 94 22" stroke="url(#livoAccent)" stroke-width="3" fill="none"/>
