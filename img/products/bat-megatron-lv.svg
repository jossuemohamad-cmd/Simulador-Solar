<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="megaBatBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="megaBatScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="megaBatAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Bateria LiFePO4 Chassi Rack/Mural MEGATRON -->
  <rect x="20" y="16" width="80" height="88" rx="8" fill="url(#megaBatBody)" stroke="#06b6d4" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <path d="M20 22 Q20 16 26 16 L94 16 Q100 16 100 22 L100 25 L20 25 Z" fill="url(#megaBatAccent)"/>

  <!-- Alças laterais de transporte / fixação em rack -->
  <rect x="15" y="44" width="5" height="32" rx="2" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <rect x="100" y="44" width="5" height="32" rx="2" fill="#334155" stroke="#64748b" stroke-width="1"/>

  <!-- MEGATRON Brand Header -->
  <text x="60" y="35" fill="#ffffff" font-size="8" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="1.2">MEGATRON</text>
  <text x="60" y="42" fill="#22d3ee" font-size="5" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">LiFePO4 ESS · 51.2V-LV</text>

  <!-- Display Central / Painel de Monitorização -->
  <rect x="30" y="47" width="60" height="28" rx="4" fill="url(#megaBatScreen)" stroke="#0d9488" stroke-width="1.2"/>
  
  <!-- LEDs de Nível de Carga (SOC 25%, 50%, 75%, 100%) -->
  <rect x="38" y="53" width="7" height="4" rx="1" fill="#22c55e"/>
  <rect x="48" y="53" width="7" height="4" rx="1" fill="#22c55e"/>
  <rect x="58" y="53" width="7" height="4" rx="1" fill="#22c55e"/>
  <rect x="68" y="53" width="7" height="4" rx="1" fill="#22c55e"/>
  <!-- Status Run / Alarm -->
  <circle cx="79" cy="55" r="2" fill="#38bdf8"/>

  <text x="60" y="67" fill="#a7f3d0" font-size="7.5" font-weight="900" font-family="'Courier New', monospace" text-anchor="middle">5.12 / 16.0 kWh</text>
  <text x="60" y="73" fill="#e2e8f0" font-size="4.2" font-family="sans-serif" text-anchor="middle">100Ah · 280Ah | 6000 CYCLES</text>

  <!-- Painel Inferior de Conexões e Disjuntor DC -->
  <rect x="26" y="80" width="68" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <!-- Bornes de Potência Positivo (+) e Negativo (-) -->
  <circle cx="36" cy="89" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="89" r="2" fill="#ffffff"/>
  <text x="36" y="98" fill="#f87171" font-size="4.5" font-weight="bold" text-anchor="middle">+</text>

  <!-- Mini Disjuntor DC Master Switch -->
  <rect x="53" y="84" width="14" height="10" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
  <rect x="57" y="86" width="6" height="6" rx="1" fill="#22c55e"/>

  <circle cx="84" cy="89" r="4.5" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="84" cy="89" r="2" fill="#94a3b8"/>
  <text x="84" y="98" fill="#94a3b8" font-size="4.5" font-weight="bold" text-anchor="middle">-</text>

  <!-- Portas BMS Comms (CAN / RS485) -->
  <rect x="47" y="85" width="4" height="4" fill="#0284c7" rx="0.5"/>
  <rect x="69" y="85" width="4" height="4" fill="#0284c7" rx="0.5"/>
</svg>

