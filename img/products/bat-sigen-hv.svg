<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sigenBatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Stackable Sigen Battery Module -->
  <rect x="22" y="16" width="76" height="88" rx="10" fill="url(#sigenBatGrad)" stroke="#475569" stroke-width="1.5"/>
  <!-- Minimalist center LED blade -->
  <rect x="58" y="24" width="4" height="24" rx="2" fill="#38bdf8"/>
  <!-- Sigenergy branding -->
  <text x="60" y="62" fill="#f8fafc" font-size="8" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="1">SIGEN BATTERY</text>
  <text x="60" y="72" fill="#38bdf8" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">HV MODULAR</text>
  <text x="60" y="81" fill="#94a3b8" font-size="5.5" font-family="sans-serif" text-anchor="middle">300V - 900V HV</text>
  <!-- Interlocking base connectors -->
  <rect x="36" y="94" width="48" height="6" rx="2" fill="#334155"/>
</svg>

