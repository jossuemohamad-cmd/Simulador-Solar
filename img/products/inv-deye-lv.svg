<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="deyeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="deyeScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Inverter Chassi -->
  <rect x="22" y="12" width="76" height="96" rx="8" fill="url(#deyeBody)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Lateral Cooling Fins -->
  <line x1="18" y1="24" x2="22" y2="24" stroke="#64748b" stroke-width="2"/>
  <line x1="18" y1="36" x2="22" y2="36" stroke="#64748b" stroke-width="2"/>
  <line x1="18" y1="48" x2="22" y2="48" stroke="#64748b" stroke-width="2"/>
  <line x1="98" y1="24" x2="102" y2="24" stroke="#64748b" stroke-width="2"/>
  <line x1="98" y1="36" x2="102" y2="36" stroke="#64748b" stroke-width="2"/>
  <line x1="98" y1="48" x2="102" y2="48" stroke="#64748b" stroke-width="2"/>
  <!-- Deye Brand Header -->
  <text x="60" y="27" fill="#0284c7" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="1">Deye</text>
  <!-- Touchscreen Display -->
  <circle cx="60" cy="54" r="22" fill="url(#deyeScreen)" stroke="#38bdf8" stroke-width="2"/>
  <text x="60" y="52" fill="#38bdf8" font-size="7" font-weight="bold" font-family="monospace" text-anchor="middle">5.0 kW</text>
  <text x="60" y="61" fill="#4ade80" font-size="5" font-family="sans-serif" text-anchor="middle">NORMAL · LV</text>
  <circle cx="60" cy="40" r="1.5" fill="#4ade80"/>
  <!-- Bottom connection panel -->
  <rect x="30" y="86" width="60" height="14" rx="3" fill="#cbd5e1"/>
  <circle cx="42" cy="93" r="3" fill="#1e293b"/>
  <circle cx="54" cy="93" r="3" fill="#1e293b"/>
  <circle cx="66" cy="93" r="3" fill="#1e293b"/>
  <circle cx="78" cy="93" r="3" fill="#1e293b"/>
</svg>

