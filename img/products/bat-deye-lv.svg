<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="batDeye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Battery Casing -->
  <rect x="20" y="16" width="80" height="88" rx="6" fill="url(#batDeye)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Front Bevel line -->
  <line x1="20" y1="36" x2="100" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Deye Branding -->
  <text x="32" y="30" fill="#0284c7" font-size="8" font-weight="900" font-family="sans-serif">Deye</text>
  <!-- Power Switch & Breaker -->
  <rect x="76" y="24" width="16" height="8" rx="2" fill="#ef4444"/>
  <circle cx="80" cy="28" r="2" fill="#ffffff"/>
  <!-- SOC Battery Indicator LEDs -->
  <circle cx="34" cy="50" r="3" fill="#22c55e"/>
  <circle cx="44" cy="50" r="3" fill="#22c55e"/>
  <circle cx="54" cy="50" r="3" fill="#22c55e"/>
  <circle cx="64" cy="50" r="3" fill="#22c55e"/>
  <circle cx="74" cy="50" r="3" fill="#22c55e"/>
  <circle cx="84" cy="50" r="3" fill="#94a3b8"/>
  <!-- Model Text -->
  <text x="60" y="70" fill="#1e293b" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">5.12 kWh</text>
  <text x="60" y="79" fill="#64748b" font-size="6" font-family="sans-serif" text-anchor="middle">51.2V 100Ah · LiFePO4</text>
  <!-- Terminals -->
  <rect x="30" y="88" width="12" height="10" rx="2" fill="#dc2626"/>
  <rect x="78" y="88" width="12" height="10" rx="2" fill="#1e293b"/>
  <text x="36" y="96" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">+</text>
  <text x="84" y="96" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">-</text>
</svg>

