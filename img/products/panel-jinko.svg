<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect x="15" y="8" width="90" height="104" rx="4" fill="url(#pFrame)" stroke="#64748b" stroke-width="2"/>
  <!-- Cell background -->
  <rect x="20" y="13" width="80" height="94" rx="2" fill="url(#pCell)"/>
  <!-- Grid Lines -->
  <line x1="20" y1="36" x2="100" y2="36" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="60" x2="100" y2="60" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="84" x2="100" y2="84" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <line x1="40" y1="13" x2="40" y2="107" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <line x1="60" y1="13" x2="60" y2="107" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <line x1="80" y1="13" x2="80" y2="107" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  <!-- Thin busbars -->
  <line x1="30" y1="13" x2="30" y2="107" stroke="#ffffff" stroke-width="0.3" opacity="0.4"/>
  <line x1="50" y1="13" x2="50" y2="107" stroke="#ffffff" stroke-width="0.3" opacity="0.4"/>
  <line x1="70" y1="13" x2="70" y2="107" stroke="#ffffff" stroke-width="0.3" opacity="0.4"/>
  <line x1="90" y1="13" x2="90" y2="107" stroke="#ffffff" stroke-width="0.3" opacity="0.4"/>
  <!-- Badge -->
  <rect x="24" y="93" width="42" height="11" rx="2" fill="#ed6c24"/>
  <text x="45" y="101" fill="#ffffff" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">JINKO 570W</text>
</svg>

