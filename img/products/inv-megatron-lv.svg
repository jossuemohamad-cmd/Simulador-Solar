<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="megaInvBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="megaScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="megaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Inverter Chassi Industrial MEGATRON -->
  <rect x="22" y="12" width="76" height="96" rx="8" fill="url(#megaInvBody)" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Top Accent Bar -->
  <path d="M22 18 Q22 12 28 12 L92 12 Q98 12 98 18 L98 22 L22 22 Z" fill="url(#megaAccent)"/>

  <!-- Lateral Cooling Fins -->
  <line x1="17" y1="28" x2="22" y2="28" stroke="#38bdf8" stroke-width="2"/>
  <line x1="17" y1="40" x2="22" y2="40" stroke="#38bdf8" stroke-width="2"/>
  <line x1="17" y1="52" x2="22" y2="52" stroke="#38bdf8" stroke-width="2"/>
  <line x1="17" y1="64" x2="22" y2="64" stroke="#38bdf8" stroke-width="2"/>
  <line x1="98" y1="28" x2="103" y2="28" stroke="#38bdf8" stroke-width="2"/>
  <line x1="98" y1="40" x2="103" y2="40" stroke="#38bdf8" stroke-width="2"/>
  <line x1="98" y1="52" x2="103" y2="52" stroke="#38bdf8" stroke-width="2"/>
  <line x1="98" y1="64" x2="103" y2="64" stroke="#38bdf8" stroke-width="2"/>

  <!-- MEGATRON Brand Header -->
  <text x="60" y="32" fill="#ffffff" font-size="8" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="1.2">MEGATRON</text>
  <text x="60" y="39" fill="#38bdf8" font-size="5" font-weight="bold" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">HYBRID INVERTER · 48V-LV</text>

  <!-- Digital OLED Display -->
  <rect x="36" y="44" width="48" height="34" rx="5" fill="url(#megaScreen)" stroke="#0284c7" stroke-width="1.2"/>
  <!-- Status LEDs -->
  <circle cx="43" cy="51" r="2" fill="#22c55e"/>
  <circle cx="50" cy="51" r="2" fill="#38bdf8"/>
  <circle cx="57" cy="51" r="2" fill="#eab308"/>
  <!-- Solar to Grid Graphic Line -->
  <line x1="43" y1="60" x2="77" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="60" y="70" fill="#38bdf8" font-size="9" font-weight="900" font-family="'Courier New', monospace" text-anchor="middle">5.0 / 12 kW</text>
  <text x="60" y="76" fill="#a5f3fc" font-size="4.5" font-family="sans-serif" text-anchor="middle">PURE SINE WAVE · MPPT</text>

  <!-- Bottom connection panel -->
  <rect x="29" y="86" width="62" height="15" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- AC/DC / Battery Terminals -->
  <circle cx="38" cy="93" r="3" fill="#ef4444"/>
  <circle cx="48" cy="93" r="3" fill="#0f172a"/>
  <circle cx="60" cy="93" r="3" fill="#38bdf8"/>
  <circle cx="72" cy="93" r="3" fill="#22c55e"/>
  <circle cx="82" cy="93" r="3" fill="#f59e0b"/>
</svg>
